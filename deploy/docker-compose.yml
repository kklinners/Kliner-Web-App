# Run from this folder on the server:  docker compose up -d --build
# Expects the two repos side by side:  ~/Kliner-Web-App  and  ~/kklinners-backend
services:
  backend:
    build: ../../kklinners-backend
    restart: unless-stopped
    env_file: ./backend.env
    environment:
      PORT: 3002
      NODE_ENV: production
      FRONTEND_URL: ${SITE_URL}

  frontend:
    build:
      context: ..
      args:
        # Same origin: Caddy sends /api/* to the backend
        NEXT_PUBLIC_API_URL: ${SITE_URL}
    restart: unless-stopped
    depends_on: [backend]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [frontend, backend]
    # Only reachable from this server; the existing proxy forwards to it
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
